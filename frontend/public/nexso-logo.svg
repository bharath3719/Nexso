<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 44" role="img">
  <title>Nexso — society management platform</title>
  <desc>Nexso wordmark: civic building with shield and shrubs, brick-pattern X</desc>

  <!-- ── SHIELD (behind building, very subtle) ── -->
  <path d="M 2,8 Q 0,6 2,6 L 28,6 Q 30,6 28,8 L 28,25 Q 28,35 15,42 Q 2,35 2,25 Z"
        fill="#ffffff" fill-opacity="0.08"
        stroke="#ffffff" stroke-width="0.9" stroke-opacity="0.22"
        stroke-linejoin="round"/>

  <!-- ── SHRUBS (subtle, at base corners of building) ── -->
  <!-- Left shrub -->
  <g fill="#ffffff" fill-opacity="0.42">
    <circle cx="4"   cy="39"   r="3.2"/>
    <circle cx="7.5" cy="37.5" r="2.8"/>
    <circle cx="10"  cy="38.8" r="2.1"/>
  </g>
  <!-- Right shrub -->
  <g fill="#ffffff" fill-opacity="0.42">
    <circle cx="26"   cy="39"   r="3.2"/>
    <circle cx="22.5" cy="37.5" r="2.8"/>
    <circle cx="20"   cy="38.8" r="2.1"/>
  </g>

  <!-- ── BUILDING ICON ── -->
  <!-- Roof cap -->
  <rect x="4"   y="9"    width="21" height="2.5" rx="1"   fill="#ffffff"/>
  <!-- Body -->
  <rect x="6.5" y="11.5" width="17" height="28.5"          fill="#ffffff"/>
  <!-- Windows row 1 -->
  <rect x="9"    y="15" width="4" height="3.5" rx="0.5" fill="#0078D4"/>
  <rect x="16.5" y="15" width="4" height="3.5" rx="0.5" fill="#0078D4"/>
  <!-- Windows row 2 -->
  <rect x="9"    y="21" width="4" height="3.5" rx="0.5" fill="#0078D4"/>
  <rect x="16.5" y="21" width="4" height="3.5" rx="0.5" fill="#0078D4"/>
  <!-- Windows row 3 -->
  <rect x="9"    y="27" width="4" height="3.5" rx="0.5" fill="#0078D4"/>
  <rect x="16.5" y="27" width="4" height="3.5" rx="0.5" fill="#0078D4"/>
  <!-- Door -->
  <rect x="12.5" y="33" width="5" height="7" rx="1.5" fill="#0078D4"/>

  <!-- ── "ne" ── -->
  <text x="31" y="33"
    font-family="'Segoe UI Variable','Segoe UI',system-ui,-apple-system,sans-serif"
    font-size="21" font-weight="300" letter-spacing="0.3" fill="#ffffff">ne</text>

  <!-- ── BRICK X — centre (67, 26) ── -->
  <!-- Arm TL→BR (rotate 45° around each brick's own centre) -->
  <rect x="58" y="19" width="8" height="4" rx="1.5" fill="#ffffff" transform="rotate(45 62 21)"/>
  <rect x="68" y="29" width="8" height="4" rx="1.5" fill="#ffffff" transform="rotate(45 72 31)"/>
  <!-- Arm TR→BL (rotate -45°) -->
  <rect x="68" y="19" width="8" height="4" rx="1.5" fill="#ffffff" transform="rotate(-45 72 21)"/>
  <rect x="58" y="29" width="8" height="4" rx="1.5" fill="#ffffff" transform="rotate(-45 62 31)"/>
  <!-- Keystone at crossing -->
  <rect x="63.5" y="22.5" width="7" height="7" rx="0.5" fill="#ffffff" transform="rotate(45 67 26)"/>

  <!-- ── "so" ── -->
  <text x="78" y="33"
    font-family="'Segoe UI Variable','Segoe UI',system-ui,-apple-system,sans-serif"
    font-size="21" font-weight="300" letter-spacing="0.3" fill="#ffffff">so</text>
</svg>

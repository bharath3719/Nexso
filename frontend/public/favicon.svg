<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" role="img">
  <title>Nexso</title>
  <!-- Background circle -->
  <circle cx="22" cy="22" r="22" fill="#0078D4"/>

  <!-- SHIELD (subtle) -->
  <path d="M 8,10 Q 6,8 8,8 L 36,8 Q 38,8 36,10 L 36,27 Q 36,37 22,43 Q 8,37 8,27 Z"
        fill="#ffffff" fill-opacity="0.08"
        stroke="#ffffff" stroke-width="0.9" stroke-opacity="0.22"
        stroke-linejoin="round"/>

  <!-- SHRUBS -->
  <g fill="#ffffff" fill-opacity="0.5">
    <circle cx="7"  cy="40" r="2.8"/>
    <circle cx="11" cy="38.5" r="2.4"/>
    <circle cx="14" cy="39.5" r="1.8"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.5">
    <circle cx="37" cy="40" r="2.8"/>
    <circle cx="33" cy="38.5" r="2.4"/>
    <circle cx="30" cy="39.5" r="1.8"/>
  </g>

  <!-- BUILDING -->
  <!-- Roof cap -->
  <rect x="9"  y="11" width="26" height="3" rx="1.2" fill="#ffffff"/>
  <!-- Body -->
  <rect x="12" y="14" width="20" height="26" fill="#ffffff"/>
  <!-- Windows row 1 -->
  <rect x="14.5" y="17" width="5" height="4" rx="0.5" fill="#0078D4"/>
  <rect x="24.5" y="17" width="5" height="4" rx="0.5" fill="#0078D4"/>
  <!-- Windows row 2 -->
  <rect x="14.5" y="23" width="5" height="4" rx="0.5" fill="#0078D4"/>
  <rect x="24.5" y="23" width="5" height="4" rx="0.5" fill="#0078D4"/>
  <!-- Door -->
  <rect x="19" y="32" width="6" height="8" rx="1.5" fill="#0078D4"/>
</svg>
